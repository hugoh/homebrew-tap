---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # macos-latest ships Homebrew preinstalled, so `brew audit` needs no setup.
  brew-audit:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap this repo
        run: brew tap hugoh/tap "$PWD"
      - name: brew audit
        run: brew audit --tap=hugoh/tap --strict
