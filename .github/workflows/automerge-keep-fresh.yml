---
name: Keep auto-merge PRs fresh

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - auto_merge_enabled
  workflow_dispatch:

concurrency:
  group: automerge-keep-fresh
  cancel-in-progress: false

permissions: {}

jobs:
  update-behind-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # An app token, not GITHUB_TOKEN, so branch updates trigger the required CI checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Update stale auto-merge PRs
        uses: hugoh/gh-workflows/automerge-keep-fresh@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
