---
name: Auto-merge GoReleaser PRs

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  enable-automerge:
    # Only same-repo PRs opened by GoReleaser's tap update (never forks).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.title, 'Brew formula update for ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # An app token, not GITHUB_TOKEN, so the merge triggers downstream
      # workflows and the keep-fresh workflow sees the auto_merge_enabled event.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
