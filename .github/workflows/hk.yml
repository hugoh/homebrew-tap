---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@b13f1839dfa9e6c2baf7bbcbbcee858e0f8d8175 # v1.40.0
    permissions:
      contents: read
      packages: read
      statuses: write
    with:
      # ubuntu-latest pre-installs Homebrew but doesn't put it on PATH; brew_audit
      # in hk.pkl needs it on PATH. Only install if it's truly missing.
      pre-hk: |
        DEFAULT_BREW_PREFIX=/home/linuxbrew/.linuxbrew
        if [ -x "$DEFAULT_BREW_PREFIX/bin/brew" ]; then
          BREW_PREFIX="$DEFAULT_BREW_PREFIX"
        elif command -v brew >/dev/null; then
          BREW_PREFIX="$(brew --prefix)"
        else
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          BREW_PREFIX="$DEFAULT_BREW_PREFIX"
        fi
        echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
        echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"
