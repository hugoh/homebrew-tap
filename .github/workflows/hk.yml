---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@b13f1839dfa9e6c2baf7bbcbbcee858e0f8d8175 # v1.40.0
    permissions:
      contents: read
      packages: read
      statuses: write
    with:
      pre-hk: |
        BREW_PREFIX=/home/linuxbrew/.linuxbrew
        echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
        echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"
      # Cache brew_audit's Homebrew API JSON download and its Ruby gem
      # bundle (rubocop et al); both are otherwise re-fetched every run.
      extra-cache-key-cmd: /home/linuxbrew/.linuxbrew/bin/brew --version
      extra-cache-paths: |
        ~/.cache/Homebrew
        /home/linuxbrew/.linuxbrew/Homebrew/Library/Homebrew/vendor/bundle
