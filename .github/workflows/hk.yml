---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
    permissions:
      contents: read
      packages: read
      statuses: write
    with:
      pre-hk: |
        BREW_PREFIX=/home/linuxbrew/.linuxbrew
        echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
        echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"
      # Cache brew_audit's Homebrew API JSON download. The vendor gem bundle
      # is not cached: restoring it over a different Homebrew checkout leaves
      # brew unable to load sorbet-runtime.
      extra-cache-key-cmd: /home/linuxbrew/.linuxbrew/bin/brew --version
      extra-cache-paths: |
        ~/.cache/Homebrew
